name: Stock Monitor (08:00~14:00 KST)

on:
  schedule:
    # GitHub Actions cron은 수 시간~하루 지연될 수 있음 (무료 계정 특성)
    # 한국 장 시간(08:00~18:00 KST = 23:00~09:00 UTC) 전체를 1시간 간격으로 커버
    # 장 시간에 실행된 cron만 모니터링 수행; 나머지는 20초 내 자동 종료
    - cron: '0 23 * * 0-4'   # 08:00 KST (월~금)
    - cron: '0 0 * * 1-5'    # 09:00 KST
    - cron: '0 1 * * 1-5'    # 10:00 KST
    - cron: '0 2 * * 1-5'    # 11:00 KST
    - cron: '0 3 * * 1-5'    # 12:00 KST
    - cron: '0 4 * * 1-5'    # 13:00 KST
    - cron: '0 5 * * 1-5'    # 14:00 KST
    - cron: '0 6 * * 1-5'    # 15:00 KST
  workflow_dispatch:   # 수동 실행 버튼

concurrency:
  group: stock-monitor-daily
  cancel-in-progress: false   # 이미 실행 중이면 새 트리거 대기

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6시간 (GitHub Actions 최대)

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: .env 파일 생성
        run: |
          cat << 'EOF' > .env
          KIS_APP_KEY=${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET=${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO=${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_SUFFIX=${{ secrets.KIS_ACCOUNT_SUFFIX }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          EOF

      - name: 카카오 토큰 파일 생성
        run: echo '${{ secrets.KAKAO_TOKEN_JSON }}' > .kakao_token.json

      - name: 주식 모니터 실행
        run: python stock_monitor.py
